# Example training config: RL runs seeded from kraken-deep-history.
#
# This is a copy of configs/default.yaml with the local market-data store
# turned on. Copy it to `models/{TICKER_ID}/{model_name}/config.yaml` (or
# pass it with `--config` to a training run) only AFTER the store has been
# seeded — the store must already hold deep bars, because the bot only
# *reads* it; it cannot backfill years from Kraken (REST caps at ~720 bars
# and says outright that older data cannot be retrieved regardless of
# `since`).
#
# ── WHY `market_data_store` IS `null` IN configs/default.yaml AND NOT HERE ──
# A non-null `market_data_store` whose root is missing (or holds no
# `.parquet` months — which is what a fallback-CSV seed leaves behind)
# raises `MarketDataStoreUnavailableError`, a ValueError, from
# `_resolve_store`: the run FAILS rather than quietly degrading to ~721
# live bars. So this file, which points at a path that exists on exactly
# one machine, must be opted into deliberately — the shipped default
# stays `null` so a fresh clone's first run is not an error on a store it
# does not have. If you hit that error, the message names the fix; the
# same fix is below.
#
# ── READ THIS BEFORE TRUSTING A NUMBER FROM A STORE RUN ────────────────────
# Turning the store on buys deep history, but it also buys a series with
# holes, and features are computed on BAR COUNTS, not wall-clock. Measured
# on the shipped ETH/USD 60m store: **158 missing bars across 28 gaps**,
# largest 39h, including a **38-bar hole at the seed/live-append seam**
# (2026-08-31 23:00 → 2026-09-02 14:00) — the boundary where the archive
# seed ends and the live append leg takes over, i.e. the region a live
# deployment trades. Across it, `return_1` reports a 39-hour return as
# though it were 1-hour, and the 24-row warm-up can span more than a day.
# No guard can catch this: every value is finite and correctly computed
# from the rows it was given. `just store-verify` counts the missing bars,
# lists the gaps and names the seam hole. Detected and labelled, not fixed —
# the real fix is time-aware feature windows over a reindexed bar grid
# (DECISION.md §14).
#
# ── Seed once, hermetically (~158s, ~13MB for the four USDT pairs) ────────
# `just store-plan` is a zero-network dry run (which monthly ZIPs a seed
# would fetch); `just store-seed` does the download AND asserts the
# report says store_mode == "market-data". Run them from THIS repo:
#
#   just store-plan
#   just store-seed
#   just store-verify
#
# Do NOT seed from a bare `python cli.py seed` in the sibling checkout.
# kraken-deep-history's own dev shell carries only pytest — no pandas, no
# pyarrow — so its `_open_store` catches ImportError, returns
# FallbackStoreWriter, and writes `.csv` that `MarketDataStore.read`
# (which globs `*.parquet`) cannot see. The seed then "succeeds", and the
# bot reads ~721 live bars while the directory looks seeded. The recipes
# above run the seeder under this repo's dev shell and refuse that mode.
#
# Which models would use it: every ticker with an entry in the seeder's
# ticker map, i.e. ETH/USD, BTC/USD, SOL/USD, XRP/USD (the *USDT spot
# family). DOGE/USD has no Binance mapping yet and is refused by the seeder
# (add it to kraken_deep_history.utils.TICKER_SYMBOL_MAP to extend).
# Per-model: keep the same `market_data_store` key in
# models/{TICKER_ID}/{model_name}/config.yaml so backtest/paper-trade reads
# (which load the model record's config) resolve the same store root.

# --- Market / data ------------------------------------------------------
ticker: "ETH/USD"

# Raw OHLCV timeframe for one environment bar (minutes). Must match the
# interval you seeded (60 -> Binance 1h).
ohlcv_interval_minutes: 60

# Starting quote-currency balance for the simulated account.
initial_balance: 10000.0

# Simulated execution costs.
fee_rate: 0.0         # fractional fee per executed order
slippage: 0.0         # fractional adverse price move on fills
allow_short: false    # whether sell actions may open a short position

# --- Environment --------------------------------------------------------
action_space: "continuous"

reward:
  mode: "pnl"
  pnl: 1.0
  risk_adjusted: 0.0
  drawdown_penalty: 0.0
  holding_penalty: 0.0
  pnl_scale: 0.0001
  risk_window: 20
  penalize_drawdown: true
  hold_confidence_threshold: 0.5

# --- Feature pipeline ---------------------------------------------------
feature_windows: [1, 4, 24]
feature_groups: ["price", "technical", "volume", "microstructure", "signals"]

# --- Exogenous signals (optional, as in default.yaml) --------------------
extra_features_file: null
# As in default.yaml, a real path: the systemd.user funding timer keeps
# this file current, one hour-floored record per pull.
funding_features_file: ~/Projects/kraken-trading-bot/signals/eth_usd_funding.jsonl
social_features_file: null
# Signal-merge guard rails, as in default.yaml (see the long comments
# there): null derives a one-hour carry from the bar interval — with years
# of seeded bars, 1h still matches the hourly signal cadence, and 0 would
# demand a record on the exact hour of every bar.  12 (as in default.yaml)
# is the funding-appropriate value: funding settles ~8-hourly, so 1h would
# leave most bars unobserved.
signal_max_age_hours: 12
signal_require_ticker: true

# --- Local market-data store (deep history enabled) ----------------------
# Root of the store seeded by `kraken-deep-history` (same layout the
# `kraken-market-data` poller writes: {PAIR_ID}/{interval_min}/{YYYY-MM}
# month-sliced parquet/CSV + `_meta.json` cursor). When set,
# `read_ohlc_dataframe` does fetch -> upsert -> read, and because the store
# already holds years of bars the read returns the WHOLE store (since/until
# default to None), far past Kraken's ~720-bar REST ceiling. The live fetch
# leg is optional now: a store-only read (source returning no candles)
# degrades with a warning and serves seeded history.
market_data_store: ~/Projects/kraken-market-data/store

# Venue provenance, recorded into the model's config.yaml and logged once
# on the store leg. `kraken-deep-history` seeds Binance-*USDT spot
# archives, so these bars are NOT Kraken's: the basis has been measured
# at +5.41 bp of level shift against a 58.30 bp hourly sigma (z-scoring
# removes the level, but a store-vs-live comparison therefore measures
# history AND venue together and has to be described that way). Leave this
# key at the `kraken-live-rest` default only if you seeded nothing and are
# reading the live leg's own append.
market_data_store_venue: "binance-spot-archive-seeded"

# --- Pinned window + out-of-sample split (REQUIRED here) -----------------
# WHY THE PIN IS NOT OPTIONAL IN THIS FILE. With `since`/`until` null,
# `data_window.has_split` is False by design — `eval_split` is inert
# against an open-ended window, so `training_frame` and `evaluation_frame`
# return the SAME object (identity, not a copy) and the backtest replays
# the bars the model was fitted on. That is an in-sample number, and
# `configs/default.yaml` says so in as many words. On the live leg the
# consequence is mild (one month of bars either way); against a seeded
# store it would throw away the entire point of the store.
#
# With the bounds below set, `train` keeps the leading 70% and `backtest`
# replays only what follows it, so the two are disjoint. Clamp these dates
# to what you actually seeded (`just store-stats` prints each source's
# span): a `since` older than the store clips to EMPTY and raises
# NotEnoughDataError naming the bar counts, which is the honest answer —
# it is better than a silently shortened window.
#
# What the depth actually buys: more normalization samples, more regime
# diversity, and a longer out-of-sample span. `--timesteps` is unchanged,
# so the policy still takes ~13% of the store with resets — more BARS is
# not more gradient steps.
data_window:
  since: "2020-01-01T00:00:00Z"   # inclusive
  until: "2026-01-01T00:00:00Z"   # exclusive
  eval_split: 0.7                 # train on the leading 70%, hold out the rest

# --- Model metadata -----------------------------------------------------
# Recorded in models/{ticker_id}/{model_name}/config.yaml at save time, so
# a retrained model remembers which deep-history root it saw.
model_name: "ppo_eth_deep"