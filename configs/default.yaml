# Default training configuration for the kraken-trading-bot RL pipeline.
# The training CLI (:class:`kraken_trading_bot.rl`) and paper-trading
# runner load per-model overrides from `models/{TICKER_ID}/{model_name}/config.yaml`.
# Values here are sane defaults; copy this file per run to customize.

# --- Market / data ------------------------------------------------------
# Ticker the environment is specialized for. Use Kraken pair notation.
ticker: "ETH/USD"

# Raw OHLCV timeframe for one environment bar (minutes).
ohlcv_interval_minutes: 60

# Starting quote-currency balance for the simulated account.
initial_balance: 10000.0

# Simulated execution costs.
fee_rate: 0.0         # fractional fee per executed order
slippage: 0.0         # fractional adverse price move on fills
allow_short: false    # whether sell actions may open a short position

# --- Environment --------------------------------------------------------
# "continuous" -> Box(3) [buy_amount, sell_amount, hold_confidence]
# "discrete"   -> Discrete(3) [0=buy, 1=hold, 2=sell]
action_space: "continuous"

# Reward shaping weights (see RewardSpec). Use "mode" presets:
#   mode: "pnl"     -> PnL-based reward only
#   mode: "sharpe"  -> risk-adjusted (per-step Sharpe proxy) reward
reward:
  mode: "pnl"
  pnl: 1.0
  risk_adjusted: 0.0
  drawdown_penalty: 0.0
  holding_penalty: 0.0
  pnl_scale: 0.0001
  risk_window: 20
  penalize_drawdown: true
  hold_confidence_threshold: 0.5

# --- Feature pipeline ---------------------------------------------------
# Look-back windows (in bars) for rolling features; e.g. [1, 4, 24] gives
# 1h, 4h and 1d views when bars are 1h candles.
feature_windows: [1, 4, 24]
# Subset of: price, technical, volume, microstructure, signals
# "signals" forwards exogenous per-(ticker, hour) columns (sentiment_score,
# article_count, novelty_flag) when extra_features_file is set; harmless no-op
# when no signals are merged.
feature_groups: ["price", "technical", "volume", "microstructure", "signals"]

# --- Exogenous signals (optional) ---------------------------------------
# Path to a JSONL file of per-(ticker, hour) signal vectors produced by
# the sibling `ticker-news-signals` project:
#   python ~/Projects/ticker-news-signals/cli.py pull --ticker ETH/USD \
#     --output signals/eth_usd.jsonl
# When set, a feature-engineering step can left-join these columns onto
# the OHLCV frame by timestamp. Null/empty disables the feature.
extra_features_file: null

# Path to a JSONL file of per-(ticker, hour) funding-rate/basis vectors
# produced by the sibling `kraken-funding-rates` project:
#   python ~/Projects/kraken-funding-rates/cli.py pull --pair ETH/USD \
#     --output signals/eth_usd_funding.jsonl
# Columns: funding_rate, basis, open_interest.  Merged after news signals
# via the same timestamp-floor left-join.  Null/empty disables the feature.
funding_features_file: null

# Path to a JSONL file of per-(ticker, hour) social/search-trend vectors
# produced by the sibling `kraken-social-signals` project:
#   python ~/Projects/kraken-social-signals/cli.py pull --ticker ETH/USD \
#     --output signals/eth_usd_social.jsonl
# Columns: stt_mention_count, stt_tilt, fng_index.  Merged after funding
# signals via the same timestamp-floor left-join.  Null/empty disables it.
social_features_file: null

# --- Local market-data store (optional) ----------------------------------
# Path to the root of the sibling `kraken-market-data` store — the
# directory containing its `_meta.json` cursor sidecar and the
# {PAIR_ID}/{interval_min}/{YYYY-MM}.parquet month-sliced files, e.g.
#   ~/Projects/kraken-market-data/store
# When set, `read_ohlc_dataframe` loads OHLCV as fetch -> upsert -> read:
# every window is also appended into the store, so later reads can return
# deeper history than Kraken's ~720-bar REST ceiling and train/backtest/
# paper-trade share one venue-consistent source of truth. Null/empty (the
# default) falls back to the live paginated Kraken fetch. See
# `kraken-market-data/INTEGRATION.md` for the full consumer contract.
#
# DEEP HISTORY (kraken-deep-history): the sibling `kraken-deep-history`
# project seeds years of Binance-archive OHLCV into this same store root
# (`seed --ticker ETH/USD --interval 60 --from 2018-01-01 --store <root>`).
# With a seeded store, setting this key gives train/backtest/paper reads
# deep history with **no consumer code change** — `read_ohlc_dataframe`
# already forwards since/until (None -> whole store) to `store.read`, and
# `pages` only bounds the live *append*, not the depth served. Turn it on
# with the ready-to-copy `configs/deep-history.example.yaml` (covers the
# ETH/USD, BTC/USD, SOL/USD, XRP/USD *USDT spot family; DOGE/USD is not
# mapped yet). Consumer contract: `kraken-deep-history/INTEGRATION.md`.
market_data_store: null

# --- Model metadata -----------------------------------------------------
# Directory layout: models/{ticker_id}/{model_name}/
#   model.zip, normalization.npz, config.yaml
model_name: "ppo_eth_01"