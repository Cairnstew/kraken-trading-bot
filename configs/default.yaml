# Default training configuration for the kraken-trading-bot RL pipeline.
# The training CLI (:class:`kraken_trading_bot.rl`) and paper-trading
# runner load per-model overrides from `models/{TICKER_ID}/{model_name}/config.yaml`.
# Values here are sane defaults; copy this file per run to customize.

# --- Market / data ------------------------------------------------------
# Ticker the environment is specialized for. Use Kraken pair notation.
ticker: "ETH/USD"

# Raw OHLCV timeframe for one environment bar (minutes).
ohlcv_interval_minutes: 60

# Starting quote-currency balance for the simulated account.
initial_balance: 10000.0

# Simulated execution costs.
fee_rate: 0.0         # fractional fee per executed order
slippage: 0.0         # fractional adverse price move on fills
allow_short: false    # whether sell actions may open a short position

# --- Environment --------------------------------------------------------
# "continuous" -> Box(3) [buy_amount, sell_amount, hold_confidence]
# "discrete"   -> Discrete(3) [0=buy, 1=hold, 2=sell]
action_space: "continuous"

# Reward shaping weights (see RewardSpec). Use "mode" presets:
#   mode: "pnl"     -> PnL-based reward only
#   mode: "sharpe"  -> risk-adjusted (per-step Sharpe proxy) reward
reward:
  mode: "pnl"
  pnl: 1.0
  risk_adjusted: 0.0
  drawdown_penalty: 0.0
  holding_penalty: 0.0
  pnl_scale: 0.0001
  risk_window: 20
  penalize_drawdown: true
  hold_confidence_threshold: 0.5

# --- Feature pipeline ---------------------------------------------------
# Look-back windows (in bars) for rolling features; e.g. [1, 4, 24] gives
# 1h, 4h and 1d views when bars are 1h candles.
feature_windows: [1, 4, 24]
# Subset of: price, technical, volume, microstructure, signals
# "signals" forwards exogenous per-(ticker, hour) columns (sentiment_score,
# article_count, novelty_flag) when extra_features_file is set; harmless no-op
# when no signals are merged.
feature_groups: ["price", "technical", "volume", "microstructure", "signals"]

# --- Exogenous signals (optional) ---------------------------------------
# Path to a JSONL file of per-(ticker, hour) signal vectors produced by
# the sibling `ticker-news-signals` project:
#   python ~/Projects/ticker-news-signals/cli.py pull --ticker ETH/USD \
#     --output signals/eth_usd.jsonl
# When set, a feature-engineering step can left-join these columns onto
# the OHLCV frame by timestamp. Null/empty disables the feature.
extra_features_file: null

# Path to a JSONL file of per-(ticker, hour) funding-rate/basis vectors
# produced by the sibling `kraken-funding-rates` project.  There is no
# cli.py at that repo's root — the CLI is the package console script, so
# invoke it through the flake (this is exactly what the systemd unit's
# ExecStart and `just funding-pull` run):
#   nix run ~/Projects/kraken-funding-rates#kraken-funding-rates -- \
#     pull --pair ETH/USD --output signals/eth_usd_funding.jsonl --append
# Columns merged: funding_rate, basis, open_interest, plus
# funding_rate_prediction (the forward/next-settlement estimate, distinct
# from the settled rate), vol24h (the perp contract's rolling 24h volume)
# and bid/ask — the last two of which the feature pipeline turns into the
# `spread` column.  Merged after news signals via the same
# timestamp-floor left-join.  Null/empty disables the feature.
#
# The path below is the one the systemd.user timer
# (kraken-trading-bot-funding.{service,timer}) populates hourly.  Those
# units are NOT declared in nix/module.nix — that is a NixOS module and
# `systemd.user.*` is not in its option namespace, so it cannot carry
# them.  Install them from the justfile, which templates the .service.in
# into ~/.config/systemd/user/: `just funding-timer` (persistent,
# hourly) or `just funding-pull` for a one-off.  `--append` adds one
# hour-floored record per pull; a duplicate inside the same hour is
# discarded at the merge seam.  Point a second pair's model at its own
# file, e.g. signals/sol_usd_funding.jsonl.
#
# The path is `~`-spelled on purpose (it is machine-independent that way)
# and the seam expands it against $HOME before checking it.  Because this
# key is non-null it is a DECLARED INTENT to use the channel: if the file
# is missing, or exists and holds no records, the read raises naming this
# key, the value as written and the expanded path rather than quietly
# dropping the funding columns — including `signal_observed`, which would
# then be absent from the observation too.  Set it to null to turn the
# channel off silently.
funding_features_file: ~/Projects/kraken-trading-bot/signals/eth_usd_funding.jsonl

# Path to a JSONL file of per-(ticker, hour) social/search-trend vectors
# produced by the sibling `kraken-social-signals` project:
#   python ~/Projects/kraken-social-signals/cli.py pull --ticker ETH/USD \
#     --output signals/eth_usd_social.jsonl
# Columns: stt_mention_count, stt_tilt, fng_index.  Merged after funding
# signals via the same timestamp-floor left-join.  Null/empty disables it.
social_features_file: null

# How long a merged signal reading may be carried forward, in hours, for
# ALL three files above.  A reading is forward-filled for at most this many
# hours (and never unboundedly), then the bar is marked unobserved; every
# merge also writes the two freshness columns into the `signals` feature
# group, so "how old is this?" is a number the agent sees rather than
# something it has to guess:
#   signal_age_hours  hours since the stalest live reading (-1.0 = none)
#   signal_observed   1.0 when a record for `ticker` landed in the window
# A value with no reading behind it keeps its historical 0.0 fill, so this
# pair is what tells a genuine 0 (extreme fear, balanced tilt) apart from
# "nothing was reported".
# null derives the bound from the bar interval — one hour of carry, i.e.
# one hourly bar, which is enough to bridge a single missed pull.  Set an
# int to widen it, or 0 for a strict per-hour match.
#
# 12 is set here because `funding_features_file` is a real, configured
# file.  Note the cadence: kraken-funding-rates settles **HOURLY** — an
# earlier revision of this comment asserted an eight-hour settlement
# cadence, which is wrong by 8x.  Measured over Kraken's own 8,791-record
# funding history, the inter-record gap histogram is
# {1.0h: 8783, 2.0h: 6, 3.0h: 1}, i.e. hourly with three stragglers.  So 12
# is a deliberate *upper bound* on an essentially hourly series, sized to
# bridge more than one missed pull — not a statement that records arrive
# every 12 hours.
# How many bars a bound covers is NOT a constant — it moves with the read
# window (`--pages`) and the bar interval — so it is deliberately not
# quoted as a ratio here.  (An earlier revision of this comment claimed
# "76 of 721 bars at 1h, 301 of 721 at 12"; that was measured against one
# particular window and reads as a general figure it never was.)
#
# TWO THINGS TO KNOW BEFORE TRUSTING `signal_observed` ON THIS CHANNEL.
#
# 1. Funding history is now recoverable, so the file is backfilled rather
#    than one record deep: `just funding-backfill` appends Kraken's own
#    ~366-day hourly history (`/historical-funding-rates`, keyless) into
#    THIS file.  That recovers **1 of 6** columns — `funding_rate` — and
#    only that one.  `basis`, `open_interest`, `funding_rate_prediction`,
#    `vol24h` and `spread` are NOT in that endpoint and stay 0.0 fill.
# 2. `signal_observed` is a per-CHANNEL OR (`observed = filled.notna()
#    .any(axis=1)`), not per column.  Once history covers the window it is
#    1.0 on every bar *while four of the six funding columns are still
#    100% zero-fill with no reading behind them*.  So on this channel
#    `signal_observed` no longer distinguishes them: it says "a funding
#    record landed here", not "every funding field has a reading here".
#    Do NOT gate any feature on `signal_observed`; use `signal_age_hours`
#    plus the column's own 0.0 fill to reason about absence.
# 3. Coverage starts at the earliest record Kraken returns — a rolling
#    ~366-day cap RECOMPUTED on every call, measured from
#    2025-10-01T08:00Z.  It ages out: run `just funding-backfill`
#    periodically as a top-up.  Bars older than the file's earliest record
#    are honestly unobserved (`signal_observed == 0`), not interpolated.
signal_max_age_hours: 12

# Require every merged signal file to actually be this ticker's file.
# The sibling projects write a `ticker` field on every record, so a file
# whose tickers exclude `ticker` is a mis-pointed config key (the BTC file
# still configured while ETH trains) — that raises instead of silently
# merging BTC's numbers onto ETH bars.  A file with NO `ticker` field at all
# is treated as an explicitly one-ticker file: it still merges, with a
# WARNING, so pre-ticker-tagged files and the documented one-ticker cron
# keep working.  Set false to merge unfiltered and only log a mismatch
# (re-enables the ticker-blind join; only for deliberately mixed files).
signal_require_ticker: true

# --- Local market-data store (optional) ----------------------------------
# Path to the root of the sibling `kraken-market-data` store — the
# directory containing its `_meta.json` cursor sidecar and the
# {PAIR_ID}/{interval_min}/{YYYY-MM}.parquet month-sliced files, e.g.
#   ~/Projects/kraken-market-data/store
# When set, `read_ohlc_dataframe` loads OHLCV as fetch -> upsert -> read:
# every window is also appended into the store, so later reads can return
# deeper history than Kraken's ~720-bar REST ceiling and train/backtest/
# paper-trade share one venue-consistent source of truth. Null/empty (the
# default) falls back to the live paginated Kraken fetch. See
# `kraken-market-data/INTEGRATION.md` for the full consumer contract.
#
# DEEP HISTORY (kraken-deep-history): the sibling `kraken-deep-history`
# project seeds years of Binance-archive OHLCV into this same store root
# (`seed --ticker ETH/USD --interval 60 --from 2018-01-01 --store <root>`).
# With a seeded store, setting this key gives train/backtest/paper reads
# deep history with **no consumer code change** — `read_ohlc_dataframe`
# already forwards since/until (None -> whole store) to `store.read`, and
# `pages` only bounds the live *append*, not the depth served. Turn it on
# with the ready-to-copy `configs/deep-history.example.yaml` (covers the
# ETH/USD, BTC/USD, SOL/USD, XRP/USD *USDT spot family; DOGE/USD is not
# mapped yet). Consumer contract: `kraken-deep-history/INTEGRATION.md`.
#
# WHY THIS STAYS `null` IN THE SHIPPED DEFAULT. A non-null value whose
# root does not exist (or holds no `.parquet` months) raises
# `MarketDataStoreUnavailableError` from `_resolve_store` — a ValueError,
# so it fails the run rather than degrading. Pointing the shipped default
# at a store path would therefore turn every first run on a fresh clone
# into an error, for a store that clone does not have. The flip belongs in
# a per-model `config.yaml` or in `configs/deep-history.example.yaml`,
# which is why those files carry the header explaining how to seed first.
#
# KNOWN LIMITATION OF A SEEDED STORE — read before trusting a store-arm
# number. The store reader globs the month files and concatenates, so a
# hole in the series is invisible downstream: features are computed on BAR
# COUNTS, not wall-clock. Measured on the shipped ETH/USD 60m store: 158
# missing bars across 28 gaps, largest 39h, including a 38-bar hole at the
# SEED/LIVE-APPEND SEAM (2026-08-31 23:00 → 2026-09-02 14:00) — the
# month-file boundary where the archive seed ends and this repo's live
# append leg takes over, i.e. the region a live deployment trades. Across
# that hole `return_1` reports a 39-hour return as though it were 1-hour,
# and the 24-row warm-up can span more than a day. No guard here can catch
# it: every value is finite and correctly computed from the rows given.
# Run `just store-verify` — it counts the missing bars, lists the gaps and
# names any seam hole. DETECTED AND LABELLED, not fixed; the real fix is
# time-aware feature windows over a reindexed bar grid (DECISION.md §14).
market_data_store: null

# --- Store venue provenance (label only) ---------------------------------
# Which venue the bars in the store came from. Read ONCE on the store leg
# and logged with the store root, so a run log states it: nothing else in
# the output distinguishes them.
#
#   kraken-live-rest              (default) an UNSEEDED store: every bar in
#                                 it was appended by this run's own live
#                                 fetch leg, so it is Kraken's.
#   binance-spot-archive-seeded   a store seeded by `kraken-deep-history`,
#                                 which is Binance-*USDT spot. Its basis
#                                 against Kraken has been measured at
#                                 +5.41 bp of level shift against a
#                                 58.30 bp hourly sigma: harmless for
#                                 z-scored features, but it must be
#                                 LABELLED, because a store-vs-live
#                                 comparison measures history AND venue
#                                 together.
#
# Recorded in models/{ticker_id}/{model_name}/config.yaml beside
# `n_features`/`n_bars`, i.e. on the artifact a reviewer already opens.
# It lives here rather than in the seeder's `_meta.json` because this repo
# consumes kraken-market-data as a PINNED flake input (rev 055d7f6): a
# sibling edit would not reach `nix develop` without a lock bump.
market_data_store_venue: "kraken-live-rest"

# --- Data window (pinning + train/eval split) ---------------------------
# WHY THIS EXISTS. `train` and `backtest` each fetched their own FRESH
# trailing window. Two fetches of the same pair have been measured to
# disagree by 16% on the fitted std of `rsi_24`, so a comparison across
# runs was comparing *data*, not configs. Pinning one window makes both
# legs see the same bars, so a difference between two runs is a difference
# between their configs.
#
#   since      ISO-8601 INCLUSIVE lower bound, or null.
#   until      ISO-8601 EXCLUSIVE upper bound, or null.
#              Half-open on purpose: it joins end-to-end without
#              double-counting the bar that bounds both sides.
#   eval_split fraction of the pinned window used for TRAINING; the
#              remainder is the out-of-sample eval slice. 1.0 = no split.
#
# Semantics, precisely:
#   * Both null (the default below) -> behaviour is EXACTLY as before:
#     a fresh trailing fetch of the whole frame, and `eval_split` is not
#     applied at all. Honouring a 0.7 split against an open-ended window
#     would silently train on 70% of the bars of every existing run.
#   * Either bound set -> `train` clips to [since, until) and keeps the
#     leading `eval_split` fraction; `backtest` clips to the same window
#     and replays only the bars AFTER that split. The two are disjoint,
#     so the backtest is genuinely out-of-sample.
#
# A BACKTEST ON TRAINING BARS IS IN-SAMPLE. With `eval_split: 1.0`, or
# with the whole window replayed, a reported return describes bars the
# model's normalization stats were fitted on and its policy saw. That is
# the mistake this block exists to make hard to commit by accident, and
# it is why the default is a real split rather than 1.0.
#
# `n_bars` on the backtest result reports the bars ACTUALLY replayed: a
# run can finish with no error while replaying a handful of bars of a much
# larger frame, so check it before trusting any return next to it.
# Boundaries are applied as a clip on the frame the read returned, not
# pushed into the read, so on the LIVE leg a pinned window still needs
# `--pages` large enough to cover it (and `eval_split` large enough to
# leave a tradable eval slice). With a store-backed read the frame is
# whatever the store already holds, so the pin is what selects the
# window: an older `since` than the live leg could ever serve becomes
# reachable — and a `since` older than the store clips to EMPTY, which
# raises NotEnoughDataError naming the bar counts. That error is the
# honest answer: pinning past your data is a configuration mistake, not
# something to paper over with a shorter window.
data_window:
  since: null
  until: null
  eval_split: 0.7

# --- Model metadata -----------------------------------------------------
# Directory layout: models/{ticker_id}/{model_name}/
#   model.zip, normalization.npz, config.yaml
model_name: "ppo_eth_01"